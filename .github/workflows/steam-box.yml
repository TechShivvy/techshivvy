name: Steam Box

on:
  workflow_dispatch:
  schedule:
    # runs at 12:30 AM UTC, offset from waka-readme's midnight run
    - cron: "30 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Steam playtime leaderboard
    runs-on: ubuntu-latest
    env:
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      STEAM_ID: ${{ secrets.STEAM_ID }}
      MARKDOWN_FILE: README.md
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Run steam-leaderboard
        run: node utils/steam-leaderboard.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Updated steam status" || exit 0
          git push
