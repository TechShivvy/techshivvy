name: Steam Box

on:
  workflow_dispatch:
  schedule:
    # runs at 12:30 AM UTC, offset from waka-readme's midnight run
    - cron: "30 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Steam playtime leaderboard
    runs-on: ubuntu-latest
    env:
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      STEAM_ID: ${{ secrets.STEAM_ID }}
      UPDATE_OPTION: MARKDOWN
      MARKDOWN_FILE: README.md
      STEAM_OPTION: ALLTIME_AND_RECENT
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build steam-box
        run: |
          git clone --depth 1 https://github.com/torresflo/steam-box-for-readme.git "$RUNNER_TEMP/steam-box"
          cd "$RUNNER_TEMP/steam-box"
          go build -o "$RUNNER_TEMP/steam" ./cmd/box/main.go
      - name: Run steam-box
        run: "$RUNNER_TEMP/steam"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Updated steam status" || exit 0
          git push
